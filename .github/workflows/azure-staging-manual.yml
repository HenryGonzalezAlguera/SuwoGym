# SUWÓ GYM 8B: despliegue sólo manual, desde main, a recursos de Staging.
# Nunca crea infraestructura, base de datos, secretos o usuarios.
name: SUWÓ GYM | Azure staging manual

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribir DEPLOY_STAGING para publicar en Azure Staging"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: suwogym-azure-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Probar y publicar Staging
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY_STAGING'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_API: ${{ vars.AZURE_WEBAPP_API }}
      AZURE_WEBAPP_WEB: ${{ vars.AZURE_WEBAPP_WEB }}
      AZURE_APP_SERVICE_PLAN: ${{ vars.AZURE_APP_SERVICE_PLAN }}
    steps:
      - name: Verificar recursos concretos Linux F1
        shell: bash
        run: |
          set -euo pipefail
          # El grupo/plan contienen aplicaciones StockFlow: no tocar esos servicios.
          [[ "$AZURE_RESOURCE_GROUP" == "rg-stockflow-demo" ]] || { echo "Grupo no permitido."; exit 1; }
          [[ "$AZURE_APP_SERVICE_PLAN" == "asp-stockflow-free" ]] || { echo "Plan no permitido."; exit 1; }
          for app in "$AZURE_WEBAPP_API" "$AZURE_WEBAPP_WEB"; do
            [[ "$app" =~ ^suwogym-stg-[a-z0-9-]+$ ]] || { echo "Solo apps suwogym-stg."; exit 1; }
            [[ "$app" != *stockflow* ]] || { echo "Destino incorrecto."; exit 1; }
          done
          [[ "$AZURE_WEBAPP_API" != "$AZURE_WEBAPP_WEB" ]] || { echo "Destinos repetidos."; exit 1; }
          # Barrera adicional: solo se pueden publicar las dos apps verificadas en Azure.
          [[ "$AZURE_WEBAPP_API" == "suwogym-stg-api-hga" ]] || { echo "API distinta de la autorizada."; exit 1; }
          [[ "$AZURE_WEBAPP_WEB" == "suwogym-stg-web-hga" ]] || { echo "WEB distinta de la autorizada."; exit 1; }

      - name: Descargar código de main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar y probar
        run: |
          dotnet restore SuwoGym.slnx
          dotnet build SuwoGym.slnx -c Release --no-restore
          dotnet test SuwoGym.Tests/SuwoGym.Tests.csproj -c Release --no-build --no-restore --verbosity minimal

      - name: Generar paquetes de API y WEB
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish SuwoGym_API/SuwoGym_API.csproj -c Release --no-restore -o "$RUNNER_TEMP/api"
          dotnet publish SuwoGym_Web/SuwoGym_Web.csproj -c Release --no-restore -o "$RUNNER_TEMP/web"

      - name: Autenticar Azure por OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validar Linux F1, región y plan compartido antes de desplegar
        shell: bash
        run: |
          set -euo pipefail
          plan_id=$(az appservice plan show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_APP_SERVICE_PLAN" --query id -o tsv)
          tier=$(az appservice plan show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_APP_SERVICE_PLAN" --query sku.name -o tsv)
          # `az appservice plan show --query reserved` puede devolver null/vacío.
          # ARM expone el indicador real de Linux en `properties.reserved`.
          linux=$(az rest --method get \
            --url "https://management.azure.com${plan_id}?api-version=2023-12-01" \
            --query properties.reserved --output tsv)
          [[ -n "$linux" && "$linux" != "None" ]] || { echo "Azure ARM no devolvió properties.reserved para el plan; se bloquea el despliegue."; exit 1; }
          location=$(az appservice plan show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_APP_SERVICE_PLAN" --query location -o tsv)
          # Azure CLI puede representar el booleano reservado como True/False o true/false.
          echo "Plan detectado: SKU=${tier}, LinuxReserved=${linux}, Región=${location}"
          [[ -n "$plan_id" && "$tier" == "F1" && "${linux,,}" == "true" ]] || { echo "Plan no es Linux F1 (SKU o LinuxReserved incorrectos)."; exit 1; }
          [[ "$location" == "Central US" || "$location" == "centralus" ]] || { echo "Región inesperada."; exit 1; }
          for app in "$AZURE_WEBAPP_API" "$AZURE_WEBAPP_WEB"; do
            app_plan=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$app" --query serverFarmId -o tsv)
            [[ "${app_plan,,}" == "${plan_id,,}" ]] || { echo "App fuera del plan permitido."; exit 1; }
          done

      - name: Publicar API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_API }}
          package: ${{ runner.temp }}/api

      - name: Publicar WEB
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_WEB }}
          package: ${{ runner.temp }}/web

      - name: Comprobar /health/live y /health/ready
        shell: bash
        run: |
          set -euo pipefail

          for app in "$AZURE_WEBAPP_API" "$AZURE_WEBAPP_WEB"; do

            # Obtener el dominio real asignado por Azure.
            host=$(az webapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app" \
              --query defaultHostName \
              --output tsv)

            if [[ -z "$host" || "$host" == "None" ]]; then
              echo "ERROR: No se encontró el dominio de $app"
              exit 1
            fi

            echo "Verificando $app"

            for endpoint in live ready; do
              valido=0

              for intento in $(seq 1 12); do
                if curl -fsS --max-time 15 \
                  "https://${host}/health/${endpoint}" \
                  | grep -Fxq Healthy; then

                  valido=1
                  break
                fi

                sleep 5
              done

              if [[ "$valido" -ne 1 ]]; then
                echo "ERROR: $app /health/$endpoint no está Healthy"
                exit 1
              fi
            done
          done

          echo "Las dos aplicaciones responden Healthy."

