# Verificación manual de GitHub OIDC y recursos Azure. NO publica código ni cambia infraestructura.
name: SUWÓ GYM | Azure staging preflight (solo lectura)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribir CHECK_STAGING para verificar Azure sin desplegar"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: suwogym-azure-preflight
  cancel-in-progress: false

jobs:
  check:
    name: Validar OIDC y recursos existentes
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'CHECK_STAGING'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_APP_SERVICE_PLAN: ${{ vars.AZURE_APP_SERVICE_PLAN }}
      AZURE_WEBAPP_API: ${{ vars.AZURE_WEBAPP_API }}
      AZURE_WEBAPP_WEB: ${{ vars.AZURE_WEBAPP_WEB }}
    steps:
      - name: Confirmar destinos exactos autorizados
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AZURE_RESOURCE_GROUP" == "rg-stockflow-demo" ]] || { echo "Grupo inesperado"; exit 1; }
          [[ "$AZURE_APP_SERVICE_PLAN" == "asp-stockflow-free" ]] || { echo "Plan inesperado"; exit 1; }
          [[ "$AZURE_WEBAPP_API" == "suwogym-stg-api-hga" ]] || { echo "API inesperada"; exit 1; }
          [[ "$AZURE_WEBAPP_WEB" == "suwogym-stg-web-hga" ]] || { echo "WEB inesperada"; exit 1; }

      - name: Comprobar acceso GitHub a Azure mediante OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Consultar plan F1 y ambas aplicaciones (sin modificaciones)
        shell: bash
        run: |
          set -euo pipefail
          plan_id=$(az appservice plan show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_APP_SERVICE_PLAN" --query id -o tsv)
          tier=$(az appservice plan show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_APP_SERVICE_PLAN" --query sku.name -o tsv)
          # `az appservice plan show --query reserved` puede devolver null/vacío.
          # ARM expone el indicador real de Linux en `properties.reserved`.
          linux=$(az rest --method get \
            --url "https://management.azure.com${plan_id}?api-version=2023-12-01" \
            --query properties.reserved --output tsv)
          [[ -n "$linux" && "$linux" != "None" ]] || { echo "Azure ARM no devolvió properties.reserved para el plan; se bloquea el despliegue."; exit 1; }
          location=$(az appservice plan show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_APP_SERVICE_PLAN" --query location -o tsv)

          # Azure CLI puede representar el booleano reservado como True/False o true/false.
          echo "Plan detectado: SKU=${tier}, LinuxReserved=${linux}, Región=${location}"
          [[ -n "$plan_id" && "$tier" == "F1" && "${linux,,}" == "true" ]] || { echo "Plan no es Linux F1 (SKU o LinuxReserved incorrectos)"; exit 1; }
          [[ "$location" == "Central US" || "$location" == "centralus" ]] || { echo "Región inesperada"; exit 1; }
          echo "Plan compartido verificado: Linux F1, $location"

          # Diagnóstico sin imprimir IDs de suscripción/recurso completos en logs públicos.
          active_subscription=$(az account show --query id -o tsv)
          echo "Huella suscripción Azure (SHA256-12): $(printf '%s' "$active_subscription" | sha256sum | cut -c1-12)"
          echo "Huella ID plan esperado (SHA256-12): $(printf '%s' "${plan_id,,}" | sha256sum | cut -c1-12)"

          for app in "$AZURE_WEBAPP_API" "$AZURE_WEBAPP_WEB"; do
            app_plan=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$app" --query serverFarmId -o tsv)
            host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$app" --query defaultHostName -o tsv)
            echo "App $app: nombre del plan asociado=${app_plan##*/}"
            echo "Huella ID plan asociado (SHA256-12): $(printf '%s' "${app_plan,,}" | sha256sum | cut -c1-12)"
            [[ "${app_plan,,}" == "${plan_id,,}" ]] || { echo "$app no pertenece al plan esperado"; exit 1; }
            [[ -n "$host" && "$host" != "None" && "$host" == *.azurewebsites.net ]] || { echo "Dominio inesperado en $app"; exit 1; }
            echo "$app → https://$host"
          done

          echo "PREFLIGHT_OK: OIDC, permisos de lectura, F1, apps y DNS verificados."
          echo "Sin despliegues, sin modificaciones de Azure y sin acceso a secretos de aplicación."
